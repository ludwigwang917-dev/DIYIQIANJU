<!doctype html>
<!--
  主屏图标（180×180）源文件，生成 app/apple-icon.png。
  重新生成（PowerShell，在项目根目录）：
    & "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=180,180 --screenshot="$PWD\app\apple-icon.png" "file:///$($PWD -replace '\\','/')/design/brand/apple-icon.html"
  iOS 会自己加圆角，所以这里铺满底色、不留透明。浏览器标签页图标用的是 app/icon.svg。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 180px; height: 180px; overflow: hidden; background: #0b0b0a; }
  body { display: grid; place-items: center; }
  .seal {
    width: 136px; height: 136px; border-radius: 50%;
    display: grid; place-items: center;
    font: 700 78px "Noto Serif SC", "Songti SC", STSong, SimSun, serif; color: #1d150a;
    background: radial-gradient(circle at 35% 30%, #e6c886, #a8823f 70%, #6f5426);
    box-shadow: 0 0 0 3px #0b0b0a, 0 0 0 6px #6f5426;
  }
  .seal span { transform: translateY(-3px); }
</style>
</head>
<body><div class="seal"><span>千</span></div></body>
</html>
