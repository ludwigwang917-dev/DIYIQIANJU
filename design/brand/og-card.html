<!doctype html>
<!--
  分享卡片（1200×630）源文件，生成 app/opengraph-image.png。
  重新生成（PowerShell，在项目根目录）：
    & "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 --screenshot="$PWD\app\opengraph-image.png" "file:///$($PWD -replace '\\','/')/design/brand/og-card.html"
  字体用 Noto Serif SC（OFL 授权）；本机没有时会退回宋体，生成前先确认。
  曲线是固定种子的随机游走，带每局 −2% 的漂移：短期有起伏，长期往下走。只是示意，不是真实模拟数据。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(ellipse 900px 420px at 50% 118%, rgba(19, 96, 63, 0.75), rgba(19, 96, 63, 0) 70%),
      radial-gradient(ellipse 700px 380px at 82% -10%, rgba(201, 163, 92, 0.12), rgba(201, 163, 92, 0) 70%),
      #0b0b0a;
    color: #ece3cf;
    font-family: "Noto Serif SC", "Songti SC", STSong, SimSun, serif;
  }
  .frame { position: absolute; inset: 28px; border: 1px solid #3e3020; border-radius: 22px; }
  .brand { position: absolute; left: 92px; top: 86px; display: flex; align-items: center; gap: 22px; }
  .seal {
    width: 84px; height: 84px; border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 700; font-size: 46px; color: #1d150a;
    background: radial-gradient(circle at 35% 30%, #e6c886, #a8823f 70%, #6f5426);
    box-shadow: 0 0 0 2px #0b0b0a, 0 0 0 4px #6f5426;
  }
  .name { font-weight: 700; font-size: 40px; letter-spacing: 0.16em; }
  .sub { margin-top: 6px; font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 20px; letter-spacing: 0.08em; color: #a99f88; }
  h1 { position: absolute; left: 92px; top: 236px; margin: 0; font-weight: 700; font-size: 76px; line-height: 1.22; letter-spacing: 0.03em; }
  h1 em { font-style: normal; color: #c9a35c; }
  .badge {
    position: absolute; left: 92px; bottom: 92px;
    padding: 12px 26px; border: 1px solid #5a4527; border-radius: 99px;
    font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 22px; color: #cfc4a8;
    background: rgba(255, 255, 255, 0.03);
  }
  .badge i { display: inline-block; width: 10px; height: 10px; margin-right: 12px; border-radius: 50%; background: #7fcfae; box-shadow: 0 0 0 4px rgba(127, 207, 174, 0.18); vertical-align: 2px; }
  svg { position: absolute; right: 70px; bottom: 74px; }
  .axis { stroke: #3e3020; stroke-width: 1.5; }
  .start { stroke: #5a4527; stroke-width: 1.5; stroke-dasharray: 5 7; }
  .curve { fill: none; stroke: #e27a62; stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; }
  .label { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 17px; fill: #857c69; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="brand">
    <div class="seal">千</div>
    <div>
      <div class="name">第一千局</div>
      <div class="sub">斗牛长期性模拟实验室</div>
    </div>
  </div>
  <h1>到第一千局，<br /><em>谁还在桌上？</em></h1>
  <div class="badge"><i></i>无真实货币 · 纯模拟 · 教育目的</div>
  <svg width="420" height="256" viewBox="0 0 420 256" aria-hidden="true">
    <line class="axis" x1="10" y1="226" x2="410" y2="226" />
    <line class="start" id="start" x1="10" y1="70" x2="410" y2="70" />
    <text class="label" id="start-label" x="410" y="58" text-anchor="end">本金</text>
    <text class="label" x="410" y="250" text-anchor="end">第 1000 局</text>
    <polyline class="curve" id="curve" points="" />
  </svg>
  <script>
    (() => {
      // mulberry32：固定种子，每次生成同一条曲线
      let seed = 20261124;
      const rand = () => {
        seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
      const steps = 200;
      let level = 0;
      const raw = [0];
      for (let i = 1; i <= steps; i++) {
        level += (rand() - 0.5) * 2 - 0.02 * 2.6;
        raw.push(level);
      }
      // 开头先涨一段（短期好运），之后回落
      const shaped = raw.map((v, i) => v + 9 * Math.sin(Math.min(i / 40, 1) * Math.PI) * Math.exp(-i / 60));
      const lo = Math.min(...shaped), hi = Math.max(...shaped);
      const yTop = 24, yBottom = 214;
      const yOf = (v) => yTop + ((hi - v) / (hi - lo)) * (yBottom - yTop);
      const pts = shaped.map((v, i) => (10 + (i / steps) * 400).toFixed(1) + "," + yOf(v).toFixed(1));
      document.getElementById("curve").setAttribute("points", pts.join(" "));
      // “本金”虚线放在起点的高度
      const y0 = yOf(shaped[0]).toFixed(1);
      const start = document.getElementById("start");
      start.setAttribute("y1", y0);
      start.setAttribute("y2", y0);
      document.getElementById("start-label").setAttribute("y", (y0 - 10).toFixed(1));
    })();
  </script>
</body>
</html>
