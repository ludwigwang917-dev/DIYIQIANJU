<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>概率余烬 · 新组件预览</title>
<link rel="stylesheet" href="out.css">
<style>
  body { margin: 0; background: radial-gradient(ellipse 80% 60% at 50% 40%, #191a17 0%, #090a09 70%); color: #ece3cf; font-family: "Microsoft YaHei", sans-serif; min-height: 100vh; }
  .ph { font: 500 14px "Noto Serif SC", "SimSun", serif; color: #cdbf9c; letter-spacing: .1em; margin: 18px 0 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; padding: 18px; border-radius: 10px; }
  .felt-bg { background: #13603f; box-shadow: inset 0 0 40px rgba(0,0,0,.5); }
  .demo-result { display: flex; align-items: center; gap: 8px; padding: 3px 4px 3px 12px; border-radius: 99px; white-space: nowrap; font-size: 12px;
                 background: rgba(8,20,15,.8); border: 1px solid rgba(236,222,184,.35); color: #eadfc2; }
  .demo-result em { font-style: normal; color: #a99f88; font-size: 11px; }
  .demo-result b { font: 700 12px "Noto Serif SC", serif; padding: 2px 9px; border-radius: 99px; background: linear-gradient(180deg, #d8b36a, #9b7838); color: #1d150a; }
</style>
</head>
<body>
<div id="root"></div>
<script src="out.js"></script>
</body>
</html>
